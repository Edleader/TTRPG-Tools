<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almanac — GM Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================================================
       WELCOME SCREEN
       ================================================ -->
  <div id="welcome-screen">
    <h1>Almanac</h1>
    <p>GM reference tool for your campaign</p>
    <div class="welcome-buttons">
      <button class="btn" id="btn-open">Open Almanac Folder</button>
    </div>
    <p style="font-size:0.75rem; color:#444; margin-top:12px;">
      Uses the File System Access API — Chrome or Edge required.
    </p>
  </div>

  <!-- ================================================
       CAMPAIGN SELECT SCREEN
       ================================================ -->
  <div id="campaign-select-screen" style="display:none">
    <h1>Select Campaign</h1>
    <p>Choose a campaign to load</p>
    <div id="campaign-list" class="campaign-list"></div>
    <div style="margin-top:24px;">
      <button class="btn btn-secondary btn-sm" id="btn-change-root">Change Folder</button>
    </div>
  </div>

  <!-- ================================================
       MAIN APP
       ================================================ -->
  <div id="app">

    <!-- Body: sidebar + main -->
    <div class="app-body">

      <!-- ============================================
           SIDEBAR
           ============================================ -->
      <nav id="sidebar">


        <!-- Search box -->
        <div class="sidebar-search-wrap">
          <input
            type="search"
            id="search-input"
            placeholder="Search files, characters, notes…"
            autocomplete="off"
            spellcheck="false"
          >
        </div>

        <!-- Normal nav (hidden when searching) -->
        <div id="sidebar-nav"></div>

        <!-- Search results (shown when searching) -->
        <div id="search-results"></div>

      </nav>

      <!-- Sidebar resize handle -->
      <div id="sidebar-resizer"></div>

      <!-- ============================================
           MAIN PANEL
           ============================================ -->
      <main id="main-panel">

        <!-- Toolbar: campaign name + file path + actions -->
        <div class="main-toolbar">
          <span class="campaign-name" id="campaign-name-label"></span>
          <span class="file-path"></span>
          <div class="toolbar-actions">
            <button class="btn btn-secondary btn-sm" id="btn-change-campaign">Switch Campaign</button>
          </div>
        </div>

        <!-- Character badge (visible when a character file is open) -->
        <div id="character-badge" class="character-badge"></div>

        <!-- Split pane container (view + dm notes, used for arc/chapter files) -->
        <div id="split-pane">

          <!-- Left: rendered content OR edit textarea -->
          <div id="left-pane">

            <!-- Left pane header: file edit controls + format toolbar -->
            <div class="pane-header" id="left-pane-header">
              <span class="pane-header-label" id="left-pane-label">Content</span>
              <div class="pane-header-actions">
                <button class="fmt-btn" id="btn-edit">Edit</button>
                <button class="fmt-btn" id="btn-save" style="display:none">Save</button>
                <button class="fmt-btn" id="btn-cancel" style="display:none">Cancel</button>
              </div>
            </div>

            <!-- Markdown format toolbar (visible in edit mode) -->
            <div id="format-toolbar">
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-action="h1" title="Heading 1">H1</button>
                <button class="fmt-btn" data-action="h2" title="Heading 2">H2</button>
                <button class="fmt-btn" data-action="h3" title="Heading 3">H3</button>
              </div>
              <div class="format-toolbar-sep"></div>
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-action="bold" title="Bold"><strong>B</strong></button>
                <button class="fmt-btn" data-action="italic" title="Italic"><em>I</em></button>
                <button class="fmt-btn" data-action="strikethrough" title="Strikethrough"><del>S</del></button>
              </div>
              <div class="format-toolbar-sep"></div>
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-action="ul" title="Bullet list">&#8226; List</button>
                <button class="fmt-btn" data-action="ol" title="Numbered list">1. List</button>
                <button class="fmt-btn" data-action="blockquote" title="Blockquote">&ldquo; Quote</button>
                <button class="fmt-btn" data-action="hr" title="Divider">&#8212; Rule</button>
              </div>
              <div class="format-toolbar-sep"></div>
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-action="table" title="Insert table">&#9776; Table</button>
              </div>
            </div>

            <!-- Rendered markdown content -->
            <div id="content-view">
              <div class="empty-state">
                <div class="empty-title">Almanac</div>
                <p>Loading…</p>
              </div>
            </div>

            <!-- Edit textarea -->
            <div id="edit-view">
              <textarea
                id="edit-textarea"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
              ></textarea>
            </div>
          </div>

          <!-- Resize handle -->
          <div id="pane-resizer" style="display:none"></div>

          <!-- Right: DM notes -->
          <div id="right-pane" style="display:none">
            <div class="dm-notes-header">
              <span>DM Notes</span>
              <button class="fmt-btn dm-notes-edit-btn" id="btn-dm-edit">Edit</button>
              <button class="fmt-btn dm-notes-edit-btn" id="btn-dm-save" style="display:none">Save</button>
              <button class="fmt-btn dm-notes-edit-btn" id="btn-dm-cancel" style="display:none">Cancel</button>
            </div>

            <!-- DM format toolbar (visible when editing DM notes) -->
            <div id="dm-format-toolbar">
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-pane="dm" data-action="h1" title="Heading 1">H1</button>
                <button class="fmt-btn" data-pane="dm" data-action="h2" title="Heading 2">H2</button>
                <button class="fmt-btn" data-pane="dm" data-action="h3" title="Heading 3">H3</button>
              </div>
              <div class="format-toolbar-sep"></div>
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-pane="dm" data-action="bold" title="Bold"><strong>B</strong></button>
                <button class="fmt-btn" data-pane="dm" data-action="italic" title="Italic"><em>I</em></button>
                <button class="fmt-btn" data-pane="dm" data-action="strikethrough" title="Strikethrough"><del>S</del></button>
              </div>
              <div class="format-toolbar-sep"></div>
              <div class="format-toolbar-group">
                <button class="fmt-btn" data-pane="dm" data-action="ul" title="Bullet list">&#8226; List</button>
                <button class="fmt-btn" data-pane="dm" data-action="ol" title="Numbered list">1. List</button>
                <button class="fmt-btn" data-pane="dm" data-action="blockquote" title="Blockquote">&ldquo; Quote</button>
                <button class="fmt-btn" data-pane="dm" data-action="hr" title="Divider">&#8212; Rule</button>
              </div>
            </div>

            <div id="dm-notes-view" class="dm-notes-content"></div>
            <div id="dm-notes-edit" class="dm-notes-edit-area">
              <textarea
                id="dm-notes-textarea"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                placeholder="Add private DM notes here — these are saved alongside the chapter file but only visible in this pane."
              ></textarea>
            </div>
          </div>

        </div><!-- /#split-pane -->

      </main>

    </div><!-- /.app-body -->

    <!-- HP bar resize handle -->
    <div id="hp-resizer"></div>

    <!-- ================================================
         BOTTOM BAR: HP Tracker + Player Panel
         ================================================ -->
    <div id="hp-bar">

      <!-- Left: HP Tracker (~66% width) -->
      <div id="hp-tracker-pane">
        <div class="hp-bar-header">
          <span>HP Tracker</span>
          <button class="btn btn-sm" id="btn-add-enemy">+ Add Enemy</button>
          <button class="btn btn-secondary btn-sm" id="btn-clear-hp">Clear All</button>
        </div>
        <div class="hp-entries" id="hp-entries">
          <span class="hp-empty">No enemies tracked. Click "Add Enemy" to begin.</span>
        </div>
      </div>

      <!-- Horizontal resizer between HP and Player panel -->
      <div id="hp-col-resizer"></div>

      <!-- Right: Player Panel (~33% width) -->
      <div id="player-panel">
        <div class="hp-bar-header">
          <span id="player-panel-level-label">Party</span>
        </div>
        <div id="player-panel-body">
          <span class="hp-empty">Loading players…</span>
        </div>
      </div>

    </div>

  </div><!-- /#app -->

  <script src="app.js"></script>
</body>
</html>
